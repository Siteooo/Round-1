<title>ROUND 01 — Muay Thai Performance System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#08090B;--g:#111419;--s:#191D23;--r:#E53935;--r2:#A92125;--w:#F5F5F5;--m:#8b929c;--au:#C6A15B;--ok:#4caf7d;--ln:#ffffff14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--w);font:15px/1.5 Inter,system-ui,sans-serif;background-image:radial-gradient(900px 400px at 80% -10%,#e5393522,transparent),repeating-linear-gradient(90deg,#ffffff05 0 1px,transparent 1px 48px)}
h1,h2,h3,.dsp{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0;text-transform:uppercase}
#app{display:flex;min-height:100vh}
aside{width:220px;background:var(--g);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;transition:width .25s}
aside.c{width:68px}aside.c .tx,aside.c .logo small{display:none}
.logo{padding:6px 10px 18px;font-family:Anton;font-size:24px;line-height:1}.logo b{color:var(--r);font-weight:400}.logo small{display:block;font:500 10px Inter;color:var(--m);letter-spacing:.12em;margin-top:6px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:var(--m);cursor:pointer;border:0;background:none;font:500 14px Inter;text-align:left;position:relative;transition:.2s}
.nv:hover{color:var(--w);background:#ffffff08}.nv.on{color:var(--w);background:#e5393518}.nv.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--r);border-radius:0 3px 3px 0}
