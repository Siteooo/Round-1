function tick(){const t=$('#tt');if(!t)return;const P=phases(),e=el()/1000;let c=0,i=0;for(;i<P.length;i++){if(e<c+P[i].s)break;c+=P[i].s}

et:id=>{const x=byId('trn',id);form('Editar treinamento',TF,x,o=>{Object.assign(x,o);save();R()})},
xt:id=>rm('trn',id,'Excluir este treinamento?'),
vt:id=>{const x=byId('trn',id);modal(`<h3>${esc(x.name)}</h3><p class="sub">${br(x.date)} ${x.time} · ${x.type} · ${x.dur} min · ${x.int}</p><p>${esc(x.goal)}</p><div class="k">BLOCOS</div>${(x.blocks||'').split('\n').filter(Boolean).map((b,i)=>`<div class="row"><b class="dsp">${i+1}</b><div>${esc(b)}</div></div>`).join('')||'<p class="sub">Sem blocos.</p>'}<p>${esc(x.notes)}</p><div class="bt"><button class="g" data-a="cl">Fechar</button><button class="p" data-a="ft" data-id="${x.id}">Registrar resultado</button></div>`)},
ft:id=>{const x=byId('trn',id);closeM();form('Registrar resultado',RF,{real:x.dur,rr:x.rounds,...x},o=>{if(o.rpe&&(o.rpe<1||o.rpe>10)){toast('Intensidade deve ser de 1 a 10');return false}Object.assign(x,o);save();R();toast('Resultado registrado')})},
rg:()=>form('Registrar treinamento',[...TF.slice(0,4),...RF.slice(1)],{},o=>{S.trn.push(mk(o,{st:'concluído',dur:o.real,int:'Moderada'}));save();R();toast('Treino registrado')}),
mm:id=>{const x=byId('trn',id);S.trn.push({...x,id:uid(),st:'modelo'});save();R();toast('Modelo salvo')},
um:id=>{const x=byId('trn',id);form('Usar modelo',TF,x,o=>{S.trn.push(mk(o,{st:'planejado'}));save();R()})},
vh:id=>{const x=byId('trn',id);modal(`<h3>${esc(x.name)}</h3><p class="sub">${br(x.date)} · ${x.type} · ${x.st}</p><p>Duração: ${x.real||'—'} min · Rounds: ${x.rr||'—'} · Intensidade: ${x.rpe||'—'}/10</p>${[['Pontos positivos',x.pos],['Dificuldades',x.dif],['Melhorar',x.mel],['Observações',x.notes]].map(([k,v])=>v?`<div class="k">${k}</div><p>${esc(v)}</p>`:'').join('')}<div class="bt"><button class="p" data-a="cl">Fechar</button></div>`)},
nc:()=>form('Nova combinação',CF,{},o=>{S.cmb.push(mk({...o,seq:o.seq.split(/→|->/).map(s=>s.trim()).filter(Boolean)},{fav:false}));save();R()}),
ec:id=>{const x=byId('cmb',id);form('Editar combinação',CF,{...x,seq:x.seq.join(' → ')},o=>{Object.assign(x,o,{seq:o.seq.split(/→|->/).map(s=>s.trim()).filter(Boolean)});save();R()})},
xc:id=>rm('cmb',id,'Excluir esta combinação?'),fc:id=>{const x=byId('cmb',id);x.fav=!x.fav;save();R()},qf:()=>{tf.fav=!tf.fav;R()},ev:n=>{ev=+n;R()},
sc:()=>{S.cfg={name:$('#s_n').value||'Jorge',sys:$('#s_s').value||'ROUND 01',goal:Math.max(1,+$('#s_g').value||4)};save();brand();toast('Ajustes salvos')},
ex:()=>{S.lastEx=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='round01-backup-'+f(new Date())+'.json';a.click()},
im:()=>$('#fi').click(),
t1:()=>{const P=phases();if(TS.fin){TS.acc=0;TS.fin=false;TS.pi=-1}if(TS.run){TS.acc=el();TS.run=false;$('#b1').textContent='Continuar'}else{TS.t0=Date.now();TS.run=true;$('#b1').textContent='Pausar';try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}tick()},
t2:()=>{TS.run=false;TS.acc=0;TS.pi=-1;TS.fin=false;$('#b1').textContent='Iniciar';tick()},
t3:()=>{const m=Math.round(el()/60000),P=phases();let c=0,n=0;P.forEach(x=>{c+=x.s;if(x.t=='ROUND'&&c*1000<=el())n++});TS.run=false;TS.acc=el();TS.fin=true;if(m>=1&&confirm(`Registrar ${m} min e ${n} rounds como treino concluído?`)){S.trn.push(mk({name:S.tm.n,date:f(new Date()),time:'',type:'Treino livre',real:m,rr:n,dur:m,int:'Moderada'},{st:'concluído'}));save();toast('Treino registrado no histórico')}A.t2()},
t4:()=>{S.tm.mute=!S.tm.mute;save();$('#b4').textContent=S.tm.mute?'Som desligado':'Som ligado'},
t5:()=>{const e=$('#tmr');document.fullscreenElement?document.exitFullscreen():e.requestFullscreen&&e.requestFullscreen()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b.dataset.d)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.dataset?.a&&e.target.tagName=='DIV')e.target.click()});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){tf.q=e.target.value;const p=e.target.selectionStart;R();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;if(i=='qc'){tf.cat=v;R()}else if(i=='hs'){hf.st=v;R()}else if(i=='ht'){hf.ty=v;R()}else if(i&&i.startsWith('c_')){const k=i.slice(2);S.tm[k]=k=='n'?v:Math.max(k=='r'?1:0,+v||0);save();A.t2()}});
$('#fi').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v!==1||!Array.isArray(d.acts)||!Array.isArray(d.trn)||!Array.isArray(d.cmb)||!d.cfg||!d.tm)throw 0;if(confirm(`Arquivo válido: ${d.acts.length} atividades, ${d.trn.length} treinos, ${d.cmb.length} combinações.\nIsso SUBSTITUI os dados atuais deste navegador. Continuar?`)){S=d;S.alu=S.alu||[];S.aul=S.aul||[];S.grade=S.grade||[];save();brand();R();toast('Backup importado')}}catch(x){toast('Arquivo inválido: não é um backup do ROUND 01')}};r.readAsText(fl);e.target.value=''};
// --- shell
function brand(){$('#lg').innerHTML=esc(S.cfg.sys).replace(/(\d+)/,'<b>$1</b>')}
function go(id){cur=id;location.hash=id;R()}
function R(){$('#nav').innerHTML=NAVS.map(([k,l])=>`<button class="nv ${k==cur?'on':''}" data-a="nav" data-id="${k}" ${k==cur?'aria-current="page"':''}>${ic(k)}<span class="tx">${l}</span></button>`).join('');
const m=$('#mn');m.innerHTML=`<div class="vw">${(V[cur]||V.dash)()}</div>`;
m.querySelectorAll('[data-n]').forEach(n=>{const t=+n.dataset.n,s=performance.now();(function st(now){const k=Math.min(1,(now-s)/800);n.textContent=Math.round(t*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)})(s)});
requestAnimationFrame(()=>m.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'));if(cur=='cron')tick()}
window.onhashchange=()=>{const h=location.hash.slice(1);if(V[h]&&h!=cur){cur=h;R()}};
brand();R();
</script></body></html>
